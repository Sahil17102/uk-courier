services:
  - type: web
    runtime: static
    name: uk-courier
    buildCommand: npm run build
    staticPublishPath: ./combined-dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_CLIENT_APP_URL
        value: https://uk-courier.onrender.com/app
      - key: VITE_AUTH_APP_URL
        value: https://uk-courier.onrender.com/app/#/login
      - key: VITE_ADMIN_APP_URL
        value: https://uk-courier-admin.onrender.com
      - key: VITE_ADMIN_AUTH_URL
        value: https://uk-courier-admin.onrender.com/#/auth/signin
      - key: VITE_API_URL
        value: https://uk-courier-api.onrender.com/api
      - key: UK_COURIER_LANDING_API_URL
        value: https://uk-courier-api.onrender.com
      - key: VITE_APP_SOCKET_URL
        value: https://uk-courier-api.onrender.com
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_PUBLIC_GEOAPIFY_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: uk-courier-admin
    rootDir: admin-dashboard
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://uk-courier-api.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://uk-courier-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: docker
    name: uk-courier-api
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://uk-courier-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://uk-courier.onrender.com,https://uk-courier-admin.onrender.com
      - key: FRONTEND_URL
        value: https://uk-courier.onrender.com/app
      - key: AUTH_OTP_DELIVERY
        value: screen
      - key: AUTO_MIGRATE_ON_START
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: COURIER_SECRET_KEY
        sync: false
      - key: ADMIN_SEED_EMAIL
        value: admin@expressmagic.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: ADMIN_FORCE_PASSWORD_RESET
        value: "false"
